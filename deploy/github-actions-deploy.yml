# OPTIONAL alternative to the Cloud Build trigger. Not active here.
# To use it: copy to .github/workflows/deploy.yml and DISABLE the Cloud Build trigger
# (otherwise every push deploys twice).
#
# One-time setup (Workload Identity Federation, no JSON keys):
#   https://github.com/google-github-actions/auth#preferred-direct-workload-identity-federation
# GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables:
#   GCP_PROJECT_ID   lord-of-the-rina-travel-app
#   GCP_WIF_PROVIDER projects/<NUMBER>/locations/global/workloadIdentityPools/github/providers/github
#   GCP_DEPLOY_SA    <deployer>@lord-of-the-rina-travel-app.iam.gserviceaccount.com
#     (needs roles/cloudbuild.builds.editor, roles/serviceusage.serviceUsageConsumer,
#      roles/storage.admin on the Cloud Build bucket, roles/iam.serviceAccountUser)

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Same pipeline as the Cloud Build trigger: one source of truth (cloudbuild.yaml)
      - name: Build & deploy with Cloud Build
        run: |
          gcloud builds submit . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --config cloudbuild.yaml \
            --substitutions "COMMIT_SHA=${{ github.sha }}"
